<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Deliverum One | AI-Augmented Delivery for Complex Initiatives</title>
  <meta
    name="description"
    content="Deliverum One combines delivery leadership with purpose-built AI agents to improve decision-making, accelerate execution and increase confidence in complex program delivery."
  />

  <meta property="og:title" content="Deliverum One — Delivery, augmented." />
  <meta
    property="og:description"
    content="Expert-led, agent-augmented delivery for complex initiatives."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deliverumone.com" />

  <style>
    :root {
      --bg: #f4f1ea;
      --text: #151515;
      --muted: #6b6861;
      --line: rgba(21, 21, 21, 0.14);
      --accent: #2f5d50;
      --x: clamp(24px, 5vw, 72px);
      --y: clamp(28px, 4vw, 52px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--y) var(--x);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
    }

    .proposition {
      margin: 0;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: right;
      white-space: nowrap;
    }

    .brand {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hero {
      display: flex;
      align-items: center;
      padding: clamp(72px, 10vh, 128px) 0;
    }

    .hero-inner {
      width: 100%;
      max-width: 1500px;
    }

    h1 {
      margin: 0;
      max-width: 10ch;
      font-size: clamp(3.8rem, 7.5vw, 8.4rem);
      line-height: 0.94;
      letter-spacing: -0.065em;
      font-weight: 600;
      text-wrap: balance;
    }

    h1 .accent {
      color: var(--accent);
    }

    .model {
      margin: clamp(34px, 4vw, 52px) 0 0;
      font-size: clamp(1.2rem, 1.7vw, 1.52rem);
      line-height: 1.24;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .support {
      margin: 24px 0 0;
      max-width: 690px;
      color: var(--muted);
      font-size: clamp(1rem, 1.25vw, 1.16rem);
      line-height: 1.62;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      color: inherit;
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      font-weight: 500;
      text-decoration: none;
    }

    .contact::after {
      content: "↗";
    }

    .legal {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: right;
    }

    @media (max-width: 860px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .brand {
        grid-row: 1;
      }

      .proposition {
        grid-row: 2;
        margin-top: 18px;
        text-align: left;
      }

      .hero {
        padding: 56px 0 72px;
      }

      h1 {
        max-width: 8.7ch;
        font-size: clamp(3.2rem, 14vw, 5.4rem);
      }

      .model {
        margin-top: 38px;
        font-size: 1.18rem;
      }

      .support {
        margin-top: 18px;
        max-width: 520px;
        font-size: 1.02rem;
      }

      .footer {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .legal {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <p class="brand">Deliverum One</p>
      <p class="proposition">Delivery, augmented.</p>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <h1 id="hero-title">
          Complex initiatives,<br />
          <span class="accent">delivered.</span>
        </h1>

        <p class="model">Expert-led, agent-augmented</p>

        <p class="support">
          Delivery leadership and purpose-built AI agents improve decisions,
          accelerate execution and increase confidence in delivery.
        </p>
      </div>
    </section>

    <footer class="footer">
      <a class="contact" href="mailto:hello@deliverumone.com">
        hello@deliverumone.com
      </a>

      <div class="legal">
        © <span id="year"></span> Deliverum One
      </div>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
