<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Deliverum One — Turning complexity into delivery</title>
  <meta
    name="description"
    content="Deliverum One helps organizations turn complex initiatives into delivered outcomes through clear ownership and effective execution."
  />

  <meta property="og:title" content="Deliverum One" />
  <meta property="og:description" content="We turn complex initiatives into delivered outcomes." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deliverumone.com" />

  <style>
    :root {
      --bg: #f4f1ea;
      --text: #151515;
      --muted: #6b6861;
      --line: rgba(21, 21, 21, 0.14);
      --accent: #2f5d50;
      --page-x: clamp(24px, 5vw, 72px);
      --page-y: clamp(28px, 4vw, 52px);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--page-y) var(--page-x);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .descriptor {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: right;
    }

    .hero {
      display: flex;
      align-items: center;
      padding: clamp(64px, 10vh, 120px) 0;
    }

    .hero-inner {
      width: 100%;
      max-width: 1500px;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(3.6rem, 8vw, 8.8rem);
      line-height: 0.94;
      letter-spacing: -0.065em;
      font-weight: 600;
      text-wrap: balance;
    }

    .accent { color: var(--accent); }

    .support {
      margin: clamp(34px, 5vw, 62px) 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(1.05rem, 1.5vw, 1.35rem);
      line-height: 1.55;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      font-weight: 500;
      text-decoration: none;
    }

    .contact::after {
      content: "↗";
      transition: transform 160ms ease;
    }

    .contact:hover::after,
    .contact:focus-visible::after {
      transform: translate(3px, -3px);
    }

    .legal {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: right;
    }

    .contact:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 6px;
      border-radius: 2px;
    }

    @media (max-width: 720px) {
      .descriptor { display: none; }
      .hero { padding: 72px 0 84px; }
      h1 {
        max-width: 8.5ch;
        font-size: clamp(3.25rem, 15vw, 5.6rem);
      }
      .support {
        max-width: 30rem;
        font-size: 1.05rem;
      }
      .footer {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .legal { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .contact::after { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">Deliverum One</div>
      <div class="descriptor">Execution · Delivery · Collaboration</div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <h1 id="hero-title">
          We turn complex initiatives into <span class="accent">delivered outcomes.</span>
        </h1>

        <p class="support">
          Deliverum One takes clear ownership of execution and helps teams work
          together to get important work delivered.
        </p>
      </div>
    </section>

    <footer class="footer">
      <a class="contact" href="mailto:hello@deliverumone.com">hello@deliverumone.com</a>
      <div class="legal">© <span id="year"></span> Deliverum One</div>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
