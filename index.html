<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deliverum One</title>
    <meta
      name="description"
      content="Deliverum One helps organizations deliver complex initiatives by taking clear ownership of execution and improving how teams work together."
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --muted: #4d4d4d;
        --line: #dcdcdc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        width: min(720px, 92vw);
        margin: 0 auto;
        padding: 18vh 0 8vh;
      }

      .brand {
        font-size: 1.15rem;
        letter-spacing: 0.03em;
        margin: 0 0 2rem;
      }

      h1 {
        font-size: clamp(1.4rem, 2.2vw, 2rem);
        line-height: 1.5;
        font-weight: 500;
        margin: 0 0 2rem;
      }

      .contact {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      a {
        color: inherit;
        text-underline-offset: 3px;
      }

      footer {
        width: min(720px, 92vw);
        margin: auto auto 0;
        padding: 1.25rem 0 1.75rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <p class="brand" aria-label="Company name">Deliverum One</p>
        <h1>
          Deliverum One helps organizations deliver complex initiatives by
          taking clear ownership of execution and improving how teams work
          together.
        </h1>
        <p class="contact">
          <a href="mailto:hello@deliverumone.com">hello@deliverumone.com</a>
        </p>
      </main>
      <footer>
        <p>© 2026 Deliverum One. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
