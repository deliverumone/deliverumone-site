<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Deliverum One | AI-Augmented Delivery for Complex Initiatives</title>
  <meta name="description" content="Deliverum One combines delivery leadership with purpose-built AI agents to improve decision-making, accelerate execution and increase confidence in complex program delivery." />

  <meta property="og:title" content="Deliverum One — Delivery, augmented." />
  <meta property="og:description" content="Expert-led, agent-augmented delivery for complex initiatives." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deliverumone.com" />

  <style>
    :root {
      --bg: #f4f1ea;
      --text: #151515;
      --muted: #6b6861;
      --line: rgba(21, 21, 21, 0.14);
      --accent: #2f5d50;
      --page-x: clamp(24px, 5vw, 72px);
      --page-y: clamp(28px, 4vw, 52px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--page-y) var(--page-x);
    }

    .brand {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero {
      display: flex;
      align-items: center;
      padding: clamp(56px, 8vh, 96px) 0;
    }

    .hero-inner {
      width: 100%;
      max-width: 1500px;
    }

    .proposition {
      margin: 0 0 24px;
      color: var(--accent);
      font-size: clamp(0.82rem, 1vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(3.6rem, 7.8vw, 8.6rem);
      line-height: 0.94;
      letter-spacing: -0.065em;
      font-weight: 600;
      text-wrap: balance;
    }

    h1 .accent { color: var(--accent); }

    .model {
      margin: clamp(30px, 4vw, 48px) 0 0;
      font-size: clamp(1.15rem, 1.6vw, 1.45rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .support {
      margin: 16px 0 0;
      max-width: 720px;
      color: var(--muted);
      font-size: clamp(1.02rem, 1.35vw, 1.2rem);
      line-height: 1.6;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      color: inherit;
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      font-weight: 500;
      text-decoration: none;
    }

    .contact::after {
      content: "↗";
      transition: transform 160ms ease;
    }

    .contact:hover::after,
    .contact:focus-visible::after { transform: translate(3px, -3px); }

    .contact:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 6px;
      border-radius: 2px;
    }

    .legal {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: right;
    }

    @media (max-width: 720px) {
      .hero { padding: 62px 0 76px; }
      h1 {
        max-width: 8.7ch;
        font-size: clamp(3.2rem, 14.8vw, 5.4rem);
      }
      .model { font-size: 1.15rem; }
      .support { font-size: 1.02rem; }
      .footer {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .legal { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact::after { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <div class="brand">Deliverum One</div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <p class="proposition">Delivery, augmented.</p>

        <h1 id="hero-title">
          Complex initiatives,<br />
          <span class="accent">delivered.</span>
        </h1>

        <p class="model">Expert-led, agent-augmented</p>

        <p class="support">
          Deliverum One combines delivery leadership and purpose-built AI agents
          to improve decisions, accelerate execution and increase confidence in delivery.
        </p>
      </div>
    </section>

    <footer class="footer">
      <a class="contact" href="mailto:hello@deliverumone.com">hello@deliverumone.com</a>
      <div class="legal">© <span id="year"></span> Deliverum One</div>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
